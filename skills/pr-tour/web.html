<!doctype html>
<!-- Served by `tour.py serve`, which fills in DATA and TOKEN. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pr-tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d10; --panel: #131317; --panel2: #18181d; --line: #24242b; --line2: #2e2e37;
  --text: #e7e7ec; --mut: #8a8a96; --dim: #5d5d68; --acc: #7c6cf0; --acc2: #9b8ff5;
  --add: rgba(46, 160, 67, .14); --addt: #56d364; --del: rgba(248, 81, 73, .13); --delt: #f47067;
  --high: #f0883e; --medium: #d4a72c; --low: #6e7681; --ok: #3fb950; --err: #f47067;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 Inter, system-ui, sans-serif; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--dim); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
button.primary .kbd { color: #fff; border-color: rgba(255,255,255,.5); }
button.ghost { background: none; border-color: transparent; color: var(--mut); }
input, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }
a { color: var(--acc2); text-decoration: none; }
code, .mono, pre, .ln { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; font-variant-ligatures: none; }
code { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
h1, h2, h3 { margin: 0; font-weight: 600; }
.mut { color: var(--mut); } .dim { color: var(--dim); }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.chip { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 11px; font-weight: 500; border: 1px solid; }
.chip.high { color: var(--high); border-color: color-mix(in srgb, var(--high) 45%, transparent); }
.chip.medium { color: var(--medium); border-color: color-mix(in srgb, var(--medium) 45%, transparent); }
.chip.low { color: var(--low); border-color: color-mix(in srgb, var(--low) 60%, transparent); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.high { background: var(--high); } .dot.medium { background: var(--medium); } .dot.low { background: var(--low); }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; }
.tag.pending { color: var(--medium); border-color: color-mix(in srgb, var(--medium) 50%, transparent); }
.sev { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; background: color-mix(in srgb, var(--medium) 20%, transparent); color: var(--medium); }
.sev.critical, .sev.major { background: color-mix(in srgb, var(--high) 20%, transparent); color: var(--high); }
.kbd { font-family: "JetBrains Mono", monospace; font-size: 10px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--mut); }
.empty { color: var(--dim); font-size: 12px; padding: 4px 0; }
.why { border-left: 2px solid var(--acc); padding: 6px 12px; background: color-mix(in srgb, var(--acc) 7%, transparent); border-radius: 0 6px 6px 0; }
.why b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--acc2); }
.visual { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.visual > pre { margin: 0; padding: 12px 14px; white-space: pre; color: #c9c9d3; overflow-x: auto; }
.mm { overflow: auto; max-height: 460px; padding: 12px; cursor: grab; }
.modal .mm { max-height: 76vh; }
.mm.panning { cursor: grabbing; user-select: none; }
.mm svg { display: block; max-width: none !important; }
.mm pre.mermaid { margin: 0; color: var(--dim); }
.vtools { position: absolute; top: 6px; right: 6px; z-index: 1; display: flex; align-items: center; gap: 2px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 2px; opacity: .55; }
.visual:hover .vtools { opacity: 1; }
.vtools button { border: none; background: none; padding: 0 6px; color: var(--mut); }
.vtools button:hover { color: var(--text); }
.vtools .zl { font-size: 11px; color: var(--mut); min-width: 38px; text-align: center; font-family: "JetBrains Mono", monospace; }

/* files: sticky headers need no overflow:hidden on .file */
.file { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.fh { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel2); font-size: 12px; position: sticky; top: 0; z-index: 2; border-radius: 8px 8px 0 0; }
.file.collapsed .fh { border-bottom: none; border-radius: 8px; }
.fh .fold { background: none; border: none; padding: 0 2px; color: var(--mut); width: 18px; }
.fh .path { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fh .a { color: var(--addt); } .fh .d { color: var(--delt); }
.fh label { display: flex; align-items: center; gap: 4px; color: var(--mut); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
.fh label.on { color: var(--text); border-color: var(--acc); }
.fh input[type=checkbox] { width: auto; margin: 0; accent-color: var(--acc); }
.code { overflow-x: auto; border-radius: 0 0 8px 8px; }
.gap { color: var(--dim); background: var(--panel2); padding: 2px 12px; font-size: 11px; }
.ln { display: grid; grid-template-columns: 44px 44px 16px 1fr; line-height: 20px; cursor: pointer; min-width: max-content; }
.ln:hover .no { color: var(--acc2); }
.ln .no { text-align: right; padding-right: 8px; color: var(--dim); user-select: none; }
.ln .sg { color: var(--dim); user-select: none; }
.ln .src { white-space: pre; padding-right: 16px; }
.ln.add { background: var(--add); } .ln.add .sg { color: var(--addt); }
.ln.del { background: var(--del); } .ln.del .sg { color: var(--delt); }
.thread, .draft, .composer { margin: 6px 10px 10px 104px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel2); padding: 10px 12px; font-family: Inter, sans-serif; font-size: 13px; cursor: default; max-width: 820px; }
.thread.resolved { opacity: .55; }
.thread.flash { outline: 2px solid var(--acc); }
.thread .body { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; }
.tmeta { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.reply { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; white-space: pre-wrap; }
.tact { display: flex; gap: 6px; margin-top: 8px; }
.quick { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--dim); }
.quick button { font-size: 11px; padding: 1px 8px; }
.draft { border-style: dashed; border-color: color-mix(in srgb, var(--medium) 50%, transparent); white-space: pre-wrap; }
.ftools { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 12px; }

/* layout: walkthrough (one changestack per screen) + thread rail */
.app { display: flex; flex-direction: column; height: 100vh; }
header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
header .title { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segs { display: flex; gap: 4px; flex: 1; }
.seg { flex: 1; height: 8px; border-radius: 4px; border: none; padding: 0; opacity: .35; }
.seg.high { background: var(--high); } .seg.medium { background: var(--medium); } .seg.low { background: var(--low); }
.seg.done { opacity: 1; } .seg.cur { outline: 2px solid var(--text); outline-offset: 2px; opacity: 1; }
.body { display: grid; grid-template-columns: var(--lw) 6px minmax(0, 1fr) 6px var(--rw); flex: 1; min-height: 0; }
.left { padding: 24px; overflow: auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.handle { cursor: col-resize; position: relative; touch-action: none; }
.handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--line); }
.handle:hover::after, body.resizing .handle::after { left: 1px; width: 3px; background: var(--acc); }
body.resizing { cursor: col-resize; user-select: none; }
.slim { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; cursor: pointer; color: var(--mut); min-width: 0; overflow: hidden; }
.slim:hover { background: var(--panel); color: var(--text); }
.slim span { writing-mode: vertical-rl; white-space: nowrap; font-size: 12px; }
.pane-btn { margin-left: auto; padding: 0 6px; }
.left h1 { font-size: 22px; line-height: 1.25; }
.center { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 14px; gap: 10px; }
.files { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 60px; }
.rail { padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); margin: 6px 4px; }
.rth { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; overflow-wrap: anywhere; }
.rth:hover { background: var(--panel2); }
.nav2 { display: flex; gap: 8px; margin-top: auto; }
.done-screen { max-width: 640px; margin: 60px auto; display: flex; flex-direction: column; gap: 14px; padding: 0 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal > .card { width: min(720px, 92vw); max-height: 86vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; overflow: auto; max-height: 260px; }
.modal label.opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.modal label.opt input { width: auto; margin-top: 3px; }
.ok { color: var(--ok); } .err { color: var(--err); white-space: pre-wrap; }
@media (max-width: 800px) { .body { grid-template-columns: 1fr !important; } .handle, .slim, .rail { display: none; } .center { min-height: 70vh; } header .title { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
const D = /*DATA*/;
const TOKEN = /*TOKEN*/;
const KEY = `pr-tour:${D.pr.url || "local"}:${D.pr.head}`;
const S = {
  stack: 0, drafts: [], resolve: [], reviewed: [], viewed: [], collapsed: [], posted: {},  // persisted
  composer: null, zoom: null, submit: null,                                                   // per page load
};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ stack: S.stack, drafts: S.drafts, resolve: S.resolve, reviewed: S.reviewed, viewed: S.viewed, collapsed: S.collapsed, posted: S.posted })); } catch {} };
const has = (list, v) => S[list].includes(v);
const toggle = (list, v, on = !has(list, v)) => { S[list] = S[list].filter(x => x !== v); if (on) S[list].push(v); };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>");
const plain = s => String(s ?? "").replace(/<!--[\s\S]*?-->/g, "").replace(/<[^>]+>/g, "").replace(/\n{3,}/g, "\n\n").trim();
const short = (s, n) => { const t = plain(s).split("\n").find(l => l.replace(/[\s#>*_`|]/g, "")) || ""; return t.length > n ? t.slice(0, n) + "…" : t; };
const sev = t => (plain(t.body).slice(0, 300).match(/\b(critical|major|medium|minor)\b/i) || [])[1]?.toLowerCase();
const base = p => p.split("/").pop();
const chip = r => `<span class="chip ${r}">${r} risk</span>`;
const canSubmit = !!D.pr.url;
const isOpen = t => !t.resolved && !has("resolve", t.key);
const openThreads = () => D.threads.filter(isOpen);
const SEV = { critical: 0, major: 1, medium: 2, minor: 3 };
const byPriority = ts => [...ts].sort((a, b) => (SEV[sev(a)] ?? (a.bot ? 5 : 4)) - (SEV[sev(b)] ?? (b.bot ? 5 : 4)));
let nextId = Math.max(0, ...S.drafts.map(d => d.id)) + 1;
const P = { lw: Math.round(innerWidth * 0.3), rw: 280, lc: false, rc: false };  // pane widths, collapsed flags
try { Object.assign(P, JSON.parse(localStorage.getItem("pr-tour:panes")) || {}); } catch {}
const savePanes = () => { try { localStorage.setItem("pr-tour:panes", JSON.stringify(P)); } catch {} };
const svgCache = {};  // changestack index -> rendered mermaid svg, so re-renders don't redraw it
const mz = {};        // visual key -> zoom; absent means fit to width

function visual(st, i, key) {
  if (!st.visual) return "";
  const m = st.visual.match(/^```(\w*)\n([\s\S]*?)\n```\s*$/);
  const lang = m ? m[1] : "text", body = m ? m[2] : st.visual;
  const enlarge = key[0] === "s" ? `<button data-act="zoom" data-s="${i}" title="Enlarge">⤢</button>` : "";
  if (lang !== "mermaid") return `<div class="visual">${enlarge ? `<div class="vtools">${enlarge}</div>` : ""}<pre>${esc(body)}</pre></div>`;
  return `<div class="visual"><div class="vtools"><button data-act="vz" data-z="${key}" data-d="-1" title="Zoom out">−</button><span class="zl" data-zl="${key}"></span><button data-act="vz" data-z="${key}" data-d="1" title="Zoom in">+</button><button data-act="vz" data-z="${key}" data-d="0" title="Fit to width">Fit</button>${enlarge}</div>
    <div class="mm" data-z="${key}" data-keep="mm-${key}" title="Scroll to zoom, drag to pan">${svgCache[i] || `<pre class="mermaid" data-s="${i}">${esc(body)}</pre>`}</div></div>`;
}
function natural(svg) {
  const vb = svg.viewBox && svg.viewBox.baseVal;
  if (vb && vb.width) return [vb.width, vb.height];
  const b = svg.getBBox(); return [b.width, b.height];
}
const clampZoom = z => Math.min(5, Math.max(0.15, z));
const fit = mm => Math.min(1, (mm.clientWidth - 24) / natural(mm.querySelector("svg"))[0]);
function setZoom(mm, z, cx, cy) {
  const svg = mm.querySelector("svg"), key = mm.dataset.z;
  if (!svg) return;
  const [w, h] = natural(svg), old = mz[key] ?? fit(mm);
  z = clampZoom(z);
  const px = cx == null ? null : (mm.scrollLeft + cx - 12) / old, py = cy == null ? null : (mm.scrollTop + cy - 12) / old;
  svg.style.width = w * z + "px"; svg.style.height = h * z + "px";
  if (px != null) { mm.scrollLeft = px * z + 12 - cx; mm.scrollTop = py * z + 12 - cy; }  // keep the point under the cursor still
  document.querySelectorAll(`[data-zl="${key}"]`).forEach(el => el.textContent = Math.round(z * 100) + "%");
}
const applyZooms = () => document.querySelectorAll(".mm").forEach(mm => mm.querySelector("svg") && setZoom(mm, mz[mm.dataset.z] ?? fit(mm)));
function afterMermaid() {
  document.querySelectorAll(".mm pre.mermaid[data-processed]").forEach(pre => { svgCache[pre.dataset.s] = pre.innerHTML; pre.outerHTML = pre.innerHTML; });
  applyZooms();
}
window.afterMermaid = afterMermaid;

function threadHTML(t) {
  const resolving = has("resolve", t.key), done = t.resolved;
  const replies = [...(S.posted[t.key] || []).map(b => ({ b, tag: "sent" })), ...S.drafts.filter(d => d.kind === "reply" && d.thread === t.key).map(d => ({ b: d.body, tag: "pending", id: d.id }))];
  const s = sev(t);
  const actionable = canSubmit && t.id;
  return `<div class="thread ${done ? "resolved" : ""}" id="th-${esc(t.key)}">
    <div class="tmeta"><b>${esc(t.author)}</b>${t.bot ? '<span class="tag">bot</span>' : ""}${s ? `<span class="sev ${s}">${s}</span>` : ""}${t.outdated ? '<span class="tag">outdated</span>' : ""}${done ? '<span class="tag">resolved</span>' : ""}${resolving ? '<span class="tag pending">resolves on submit</span>' : ""}<span class="grow"></span><a href="${esc(t.url)}" target="_blank" class="mono" style="font-size:11px">${esc(base(t.path || "general"))}${t.line ? ":" + t.line : ""} ↗</a></div>
    <div class="body">${md(plain(t.body))}</div>
    ${replies.map(r => `<div class="reply"><div class="tmeta"><b>you</b><span class="tag ${r.tag === "pending" ? "pending" : ""}">${r.tag}</span>${r.id ? `<span class="grow"></span><button class="ghost" data-act="deldraft" data-d="${r.id}">Delete</button>` : ""}</div>${md(r.b)}</div>`).join("")}
    ${done || !actionable ? "" : `
    <div class="tact"><input class="rin" data-t="${esc(t.key)}" placeholder="Reply… (Enter adds it to your review)"><button data-act="resolve" data-t="${esc(t.key)}">${resolving ? "Keep open" : "✓ Resolve"}</button></div>
    <div class="quick">Quick replies <button data-act="quick" data-t="${esc(t.key)}" data-q="Won't fix: ">Won't fix — explain</button><button data-act="quick" data-t="${esc(t.key)}" data-q="Fixed in the next push.">Fixed in the next push</button></div>`}
  </div>`;
}
function draftHTML(d) {
  return `<div class="draft"><div class="tmeta"><b>you</b><span class="tag pending">pending</span><span class="grow"></span><button class="ghost" data-act="deldraft" data-d="${d.id}">Delete</button></div>${md(d.body)}</div>`;
}
function composerHTML(c) {
  return `<div class="composer"><textarea id="ctext" placeholder="Comment on ${c.line ? "line " + c.line : "removed line " + c.old_line}… (⌘↵ adds it to your review)"></textarea>
    <div class="tact"><button class="primary" data-act="adddraft">Add to review</button><button class="ghost" data-act="cancel">Cancel</button></div></div>`;
}
const sameLine = (a, path, o, n) => a.path === path && (a.line ?? null) === n && (a.old_line ?? null) === o;
const onLine = (t, o, n) => t.line && (t.side === "old" ? t.line === o && n === null : t.line === n);

function fileHTML(si, f) {
  const lines = f.hunks.flat(), adds = lines.filter(l => l[0] === "+").length, dels = lines.filter(l => l[0] === "-").length;
  const shut = has("collapsed", f.path), viewed = has("viewed", f.path);
  const ts = D.threads.filter(t => t.path === f.path);
  let rows = "";
  f.hunks.forEach((h, hi) => {
    if (hi) rows += `<div class="gap">⋯</div>`;
    for (const [k, o, n, s] of h) {
      rows += `<div class="ln ${k === "+" ? "add" : k === "-" ? "del" : ""}" data-s="${si}" data-path="${esc(f.path)}" data-old="${esc(f.old_path)}" data-o="${o ?? ""}" data-n="${n ?? ""}"><span class="no">${o ?? ""}</span><span class="no">${n ?? ""}</span><span class="sg">${k === " " ? "" : k}</span><span class="src">${esc(s) || " "}</span></div>`;
      for (const t of ts.filter(t => onLine(t, o, n))) rows += threadHTML(t);
      for (const d of S.drafts.filter(d => d.kind === "line" && sameLine(d, f.path, o, n))) rows += draftHTML(d);
      if (S.composer && sameLine(S.composer, f.path, o, n)) rows += composerHTML(S.composer);
    }
  });
  return `<div class="file ${shut ? "collapsed" : ""}"><div class="fh">
    <button class="fold" data-act="fold" data-p="${esc(f.path)}" title="Collapse / expand">${shut ? "▸" : "▾"}</button>
    <span class="mono path grow" data-act="fold" data-p="${esc(f.path)}" title="${esc(f.path)}">${f.old_path !== f.path ? `${esc(f.old_path)} → ` : ""}${esc(f.path)}</span>
    <span class="mono">${adds ? `<span class="a">+${adds}</span> ` : ""}${dels ? `<span class="d">−${dels}</span>` : ""}${adds || dels ? "" : '<span class="dim">no line changes</span>'}</span>
    <label class="${viewed ? "on" : ""}" data-act="viewed" data-p="${esc(f.path)}"><input type="checkbox" ${viewed ? "checked" : ""} tabindex="-1"> Viewed</label>
    ${f.link ? `<a href="${esc(f.link)}" target="_blank" title="Open in the PR/MR">↗</a>` : ""}</div>
    ${shut ? "" : `<div class="code">${rows || '<div class="empty" style="padding:8px 12px">Binary or rename, nothing to show.</div>'}</div>`}</div>`;
}

function submitButton() {
  const n = S.drafts.length + S.resolve.length;
  return `<button class="primary" data-act="submit" ${canSubmit ? "" : 'disabled title="Range mode: no PR/MR to submit to"'}>Submit review${n ? ` (${n})` : ""}</button>`;
}

function rail() {
  const by = {};
  for (const t of byPriority(openThreads())) (by[t.author] ||= []).push(t);
  const drafts = S.drafts.map(d => {
    const where = d.kind === "line" ? `${base(d.path)}:${d.line ?? d.old_line}` : `reply to ${D.threads.find(t => t.key === d.thread)?.author ?? "thread"}`;
    return `<div class="rth" data-act="godraft" data-d="${d.id}"><span class="mono dim">${esc(where)}</span><br>${md(d.body.slice(0, 90))}</div>`;
  }).join("");
  return `<aside class="rail">
    <div class="row"><span class="dim" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em">Review</span><button class="ghost pane-btn" data-act="pane" data-side="r" title="Collapse  ]">»</button></div>
    <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:8px">
      <div class="row"><b class="grow">Your review</b><span class="mut">${S.reviewed.length}/${D.stacks.length}</span></div>
      ${submitButton()}
      <div class="dim" style="font-size:11px">${canSubmit ? "Nothing is sent until you submit." : "Range mode: comments stay in this browser."}</div>
    </div>
    <div><h3>Pending · ${S.drafts.length + S.resolve.length}</h3>${drafts || ""}${S.resolve.length ? `<div class="rth dim">${S.resolve.length} thread${S.resolve.length > 1 ? "s" : ""} to resolve</div>` : ""}${drafts || S.resolve.length ? "" : '<div class="empty">Click a line to comment.</div>'}</div>
    <div><h3>Open threads · ${openThreads().length}</h3>
      ${Object.entries(by).map(([a, l]) => `<div style="margin-bottom:8px"><div class="row" style="padding:0 8px"><b>${esc(a)}</b>${l[0].bot ? '<span class="tag">bot</span>' : ""}<span class="dim">${l.length}</span></div>
        ${l.map(t => `<div class="rth" data-act="goto" data-t="${esc(t.key)}">${sev(t) ? `<span class="sev ${sev(t)}">${sev(t)}</span> ` : ""}${md(short(t.body, 90))}<br><span class="mono dim">${esc(base(t.path || "general"))}${t.line ? ":" + t.line : ""}${t.stack == null ? " · outside the diff" : ` · stack ${t.stack + 1}`}</span></div>`).join("")}</div>`).join("") || '<div class="empty">No open threads.</div>'}
    </div></aside>`;
}

function page() {
  const n = D.stacks.length;
  const header = `<header><b>pr-tour</b><span class="mut title">${D.pr.url ? `<a href="${esc(D.pr.url)}" target="_blank">${esc(D.pr.title || D.pr.url)}</a>` : esc(D.pr.title || "local range")}</span>
    <div class="segs">${D.stacks.map((st, i) => `<button class="seg ${st.risk} ${has("reviewed", i) ? "done" : ""} ${i === S.stack ? "cur" : ""}" data-act="stack" data-s="${i}" title="${i + 1}. ${esc(st.title)}"></button>`).join("")}</div>
    <span class="mut">${Math.min(S.stack + 1, n)} / ${n}</span>${submitButton()}</header>`;
  if (S.stack >= n) return `<div class="app">${header}<div class="done-screen">
    <h1>Tour done</h1>
    <div class="mut">${S.reviewed.length}/${n} changestacks reviewed · ${S.drafts.length} pending comments · ${openThreads().length} open threads</div>
    ${D.stacks.map((st, i) => `<div class="row card" style="padding:10px;cursor:pointer" data-act="stack" data-s="${i}"><span>${has("reviewed", i) ? "✓" : "–"}</span><span class="dot ${st.risk}"></span><span class="grow">${esc(st.title)}</span></div>`).join("")}
    <div class="row">${submitButton()}<button data-act="stack" data-s="0">Back to the start</button></div></div></div>`;
  const st = D.stacks[S.stack], ts = D.threads.filter(t => t.stack === S.stack);
  const lines = st.files.flatMap(f => f.hunks.flat());
  const slimLeft = `<div class="slim" data-act="pane" data-side="l" title="Expand  [">»<span>${S.stack + 1}. ${esc(st.title)}</span></div>`;
  const slimRight = `<div class="slim" data-act="pane" data-side="r" title="Expand  ]">«<span>Review · ${S.drafts.length + S.resolve.length} pending · ${openThreads().length} open threads</span></div>`;
  return `<div class="app">${header}<div class="body" style="--lw:${P.lc ? 32 : P.lw}px;--rw:${P.rc ? 32 : P.rw}px">
    ${P.lc ? slimLeft : `<div class="left">
      <div class="row"><span class="dim">Changestack ${S.stack + 1} of ${n}</span>${chip(st.risk)}<button class="ghost pane-btn" data-act="pane" data-side="l" title="Collapse  [">«</button></div>
      <h1>${esc(st.title)}</h1>
      ${st.why ? `<div class="why"><b>What to check</b>${md(st.why)}</div>` : ""}
      ${visual(st, S.stack, "s" + S.stack)}
      <div><b>Threads here</b>${ts.length ? byPriority(ts).map(t => `<div class="rth" data-act="goto" data-t="${esc(t.key)}">${isOpen(t) ? "" : "✓ "}${sev(t) ? `<span class="sev ${sev(t)}">${sev(t)}</span> ` : ""}<b>${esc(t.author)}</b> ${md(short(t.body, 80))}</div>`).join("") : '<div class="empty">None.</div>'}</div>
      <div class="nav2"><button data-act="prev" ${S.stack ? "" : "disabled"}>← Back <span class="kbd">K</span></button><span class="grow"></span><button class="primary" data-act="lgtm">Looks good, next → <span class="kbd">J</span></button></div>
    </div>`}
    <div class="handle" data-side="l" title="Drag to resize, double-click to collapse"></div>
    <div class="center">
      <div class="ftools"><b style="color:var(--text)">${st.files.length} file${st.files.length === 1 ? "" : "s"}</b>
        <span class="mono"><span style="color:var(--addt)">+${lines.filter(l => l[0] === "+").length}</span> <span style="color:var(--delt)">−${lines.filter(l => l[0] === "-").length}</span></span>
        <span>${st.files.filter(f => has("viewed", f.path)).length}/${st.files.length} viewed</span><span class="grow"></span>
        <button data-act="foldall" data-v="0">Expand all</button><button data-act="foldall" data-v="1">Collapse all</button></div>
      <div class="files" data-keep="files">${st.files.map(f => fileHTML(S.stack, f)).join("")}</div>
    </div>
    <div class="handle" data-side="r" title="Drag to resize, double-click to collapse"></div>
    ${P.rc ? slimRight : rail()}</div></div>`;
}

function submitModal() {
  const m = S.submit, gl = D.pr.platform === "gitlab";
  const comments = S.drafts.filter(d => d.kind === "line").length, replies = S.drafts.filter(d => d.kind === "reply").length;
  const events = [["COMMENT", "Comment", "Feedback without an explicit verdict."], ["APPROVE", "Approve", "Approve these changes."]];
  if (!gl) events.push(["REQUEST_CHANGES", "Request changes", "Feedback that must be addressed before merging."]);
  return `<div class="modal" data-act="close"><div class="card" data-stop>
    <div class="row"><h2 class="grow" style="font-size:16px">Submit review</h2><button class="ghost" data-act="close">✕</button></div>
    <textarea id="sbody" placeholder="Leave a summary (optional)">${esc(m.body)}</textarea>
    ${events.map(([v, l, d]) => `<label class="opt"><input type="radio" name="ev" value="${v}" ${m.event === v ? "checked" : ""} data-act="event"><span><b>${l}</b><br><span class="mut">${d}</span></span></label>`).join("")}
    <div class="mut">Sends ${comments} line comment${comments === 1 ? "" : "s"}${gl ? " (draft notes, published together)" : " in one review"}, ${replies} repl${replies === 1 ? "y" : "ies"}, and resolves ${S.resolve.length} thread${S.resolve.length === 1 ? "" : "s"} on ${esc(D.pr.url)}.</div>
    ${m.result ? `<div class="${m.result.error ? "err" : "ok"}">${m.result.error ? `Failed: ${esc(m.result.error)}${m.result.sent.length ? `\n${m.result.sent.length} item(s) went out before the failure and were removed from your pending list.` : ""}` : "Review sent."}</div>
      ${(m.result.links || []).map(l => `<a href="${esc(l)}" target="_blank">${esc(l)}</a>`).join("<br>")}` : ""}
    <div class="row"><span class="grow"></span><button data-act="close">${m.result && !m.result.error ? "Close" : "Cancel"}</button>
      ${m.result && !m.result.error ? "" : `<button class="primary" data-act="send" ${m.busy ? "disabled" : ""}>${m.busy ? "Sending…" : "Submit review"}</button>`}</div>
  </div></div>`;
}

function render() {
  const keep = {};
  document.querySelectorAll("[data-keep]").forEach(el => keep[el.dataset.keep] = [el.scrollTop, el.scrollLeft]);
  document.getElementById("app").innerHTML = page();
  document.getElementById("overlay").innerHTML =
    (S.zoom != null ? `<div class="modal" data-act="close"><div class="card" data-stop style="width:min(1200px,94vw)"><b>${esc(D.stacks[S.zoom].title)}</b>${visual(D.stacks[S.zoom], S.zoom, "z" + S.zoom)}</div></div>` : "") +
    (S.submit ? submitModal() : "");
  applyZooms();
  document.querySelectorAll("[data-keep]").forEach(el => [el.scrollTop, el.scrollLeft] = keep[el.dataset.keep] || [0, 0]);
  document.getElementById("ctext")?.focus();
  if (window.mermaid) window.mermaid.run({ querySelector: ".mermaid:not([data-processed])" }).then(afterMermaid, () => {});
  save();
}
function togglePane(side) {
  if (side === "l") P.lc = !P.lc; else P.rc = !P.rc;
  savePanes(); render();
}

function flash(key) {
  const el = document.getElementById("th-" + key);
  if (!el) return false;
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
  return true;
}
function gotoThread(key) {
  const t = D.threads.find(t => t.key === key);
  if (t.stack == null) return window.open(t.url, "_blank");
  S.stack = t.stack; toggle("collapsed", t.path, false); render();
  if (!flash(key)) window.open(t.url, "_blank");  // outdated or off the shown lines: GitHub/GitLab has it
}
let nextIdx = -1;
function nextThread() {
  const ts = byPriority(openThreads()).filter(t => t.stack != null);
  if (!ts.length) return;
  nextIdx = (nextIdx + 1) % ts.length;
  gotoThread(ts[nextIdx].key);
}
function move(d) { S.stack = Math.max(0, Math.min(D.stacks.length, S.stack + d)); S.composer = null; render(); document.querySelector("[data-keep=files]")?.scrollTo(0, 0); }
function addReply(key, body) {
  if (!body.trim()) return;
  const t = D.threads.find(t => t.key === key);
  S.drafts.push({ id: nextId++, kind: "reply", thread: key, thread_id: t.id, reply_to: t.reply_to, body: body.trim() });
  render();
}
async function send() {
  S.submit.body = document.getElementById("sbody").value;
  S.submit.busy = true; render();
  const review = {
    event: S.submit.event, body: S.submit.body,
    comments: S.drafts.filter(d => d.kind === "line").map(({ id, path, old_path, line, old_line, body }) => ({ id, path, old_path, line, old_line, body })),
    replies: S.drafts.filter(d => d.kind === "reply").map(({ id, thread_id, reply_to, body }) => ({ id, thread: thread_id, reply_to, body })),
    resolve: S.resolve.map(k => D.threads.find(t => t.key === k).id),
  };
  let result;
  try {
    const r = await fetch("/submit", { method: "POST", headers: { "Content-Type": "application/json", "X-Tour-Token": TOKEN }, body: JSON.stringify(review) });
    result = r.ok ? await r.json() : { sent: [], error: (await r.json().catch(() => ({}))).error || `HTTP ${r.status}` };
  } catch (e) { result = { sent: [], error: `Could not reach tour.py serve (${e.message}). Is it still running?` }; }
  const sent = new Set(result.sent);
  for (const d of S.drafts.filter(d => d.kind === "reply" && sent.has(d.id))) (S.posted[d.thread] ||= []).push(d.body);
  S.drafts = S.drafts.filter(d => !sent.has(d.id));
  for (const t of D.threads) if (sent.has(t.id) && has("resolve", t.key)) { t.resolved = true; toggle("resolve", t.key, false); }
  if (!result.error) S.submit.body = "";
  S.submit.busy = false; S.submit.result = result; render();
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (!a) {
    const ln = e.target.closest(".ln");
    if (ln && !getSelection().toString()) {
      S.composer = { stack: +ln.dataset.s, path: ln.dataset.path, old_path: ln.dataset.old, line: ln.dataset.n ? +ln.dataset.n : null, old_line: ln.dataset.o ? +ln.dataset.o : null };
      render();
    }
    return;
  }
  const { act } = a.dataset, key = a.dataset.t;
  if (act === "close" && e.target.closest("[data-stop]") && !e.target.closest("button")) return;  // a click inside a modal, not on its backdrop
  if (act === "stack") { S.stack = +a.dataset.s; S.composer = null; render(); }
  else if (act === "prev") move(-1);
  else if (act === "lgtm") { toggle("reviewed", S.stack, true); move(1); }
  else if (act === "fold") { toggle("collapsed", a.dataset.p); render(); }
  else if (act === "viewed") { e.preventDefault(); const p = a.dataset.p, on = !has("viewed", p); toggle("viewed", p, on); toggle("collapsed", p, on); render(); }
  else if (act === "foldall") { for (const f of D.stacks[S.stack].files) toggle("collapsed", f.path, a.dataset.v === "1"); render(); }
  else if (act === "resolve") { toggle("resolve", key); render(); }
  else if (act === "quick") { const inp = document.querySelector(`.rin[data-t="${CSS.escape(key)}"]`); inp.value = a.dataset.q; inp.focus(); }
  else if (act === "adddraft") { const v = document.getElementById("ctext").value.trim(); if (v) S.drafts.push({ id: nextId++, kind: "line", ...S.composer, body: v }); S.composer = null; render(); }
  else if (act === "cancel") { S.composer = null; render(); }
  else if (act === "deldraft") { S.drafts = S.drafts.filter(d => d.id !== +a.dataset.d); render(); }
  else if (act === "goto") gotoThread(key);
  else if (act === "godraft") {
    const d = S.drafts.find(d => d.id === +a.dataset.d);
    if (d.kind === "reply") return gotoThread(d.thread);
    S.stack = d.stack; toggle("collapsed", d.path, false); render();
    document.querySelector(`.ln[data-path="${CSS.escape(d.path)}"][data-o="${d.old_line ?? ""}"][data-n="${d.line ?? ""}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  else if (act === "zoom") { if (!a.closest(".modal")) { S.zoom = +a.dataset.s; render(); } }
  else if (act === "pane") togglePane(a.dataset.side);
  else if (act === "vz") {
    const mm = a.closest(".visual").querySelector(".mm"), key = a.dataset.z, d = +a.dataset.d;
    if (d) mz[key] = clampZoom((mz[key] ?? fit(mm)) * (d > 0 ? 1.25 : 0.8)); else delete mz[key];
    setZoom(mm, mz[key] ?? fit(mm));
  }
  else if (act === "submit") { S.submit = { event: "COMMENT", body: "", result: null, busy: false }; render(); }
  else if (act === "event") { S.submit.event = a.value; S.submit.body = document.getElementById("sbody").value; }
  else if (act === "send") send();
  else if (act === "close") { if (S.submit?.busy) return; S.zoom = null; S.submit = null; render(); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) {
    if (e.key === "Enter" && e.target.classList.contains("rin")) addReply(e.target.dataset.t, e.target.value);
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "ctext") document.querySelector("[data-act=adddraft]").click();
    if (e.key === "Escape" && e.target.id === "ctext") { S.composer = null; render(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "j") { toggle("reviewed", S.stack, true); move(1); }
  else if (e.key === "k") move(-1);
  else if (e.key === "n") nextThread();
  else if (e.key === "[") togglePane("l");
  else if (e.key === "]") togglePane("r");
  else if (e.key === "Escape" && !S.submit?.busy) { S.zoom = null; S.submit = null; S.composer = null; render(); }
});
window.addEventListener("beforeunload", e => { if (S.submit?.busy) e.preventDefault(); });
document.addEventListener("wheel", e => {
  const mm = e.target.closest(".mm");
  if (!mm || !mm.querySelector("svg")) return;
  e.preventDefault();  // also stops a trackpad pinch (wheel + ctrlKey) from zooming the whole page
  const r = mm.getBoundingClientRect(), key = mm.dataset.z, cur = mz[key] ?? fit(mm);
  const z = clampZoom(cur * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
  mz[key] = cur;  // setZoom anchors the cursor point against the zoom it is leaving
  setZoom(mm, z, e.clientX - r.left, e.clientY - r.top);
  mz[key] = z;
}, { passive: false });
let pan = null, drag = null;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".handle");
  if (h) {
    e.preventDefault();
    const side = h.dataset.side;
    if (side === "l" ? P.lc : P.rc) togglePane(side);  // dragging a collapsed pane's handle opens it
    drag = { side };
    document.body.classList.add("resizing");
    return;
  }
  const mm = e.target.closest(".mm");
  if (mm && e.button === 0) { pan = { mm, x: e.clientX, y: e.clientY, l: mm.scrollLeft, t: mm.scrollTop }; mm.classList.add("panning"); }
});
document.addEventListener("pointermove", e => {
  if (pan) { pan.mm.scrollLeft = pan.l - (e.clientX - pan.x); pan.mm.scrollTop = pan.t - (e.clientY - pan.y); }
  if (!drag) return;
  const body = document.querySelector(".body"), r = body.getBoundingClientRect(), minCenter = 360;
  if (drag.side === "l") P.lw = Math.round(Math.max(220, Math.min(e.clientX - r.left, r.width - minCenter - (P.rc ? 32 : P.rw))));
  else P.rw = Math.round(Math.max(200, Math.min(r.right - e.clientX, r.width - minCenter - (P.lc ? 32 : P.lw))));
  body.style.setProperty(drag.side === "l" ? "--lw" : "--rw", (drag.side === "l" ? P.lw : P.rw) + "px");
});
document.addEventListener("pointerup", () => {
  if (pan) { pan.mm.classList.remove("panning"); pan = null; }
  if (drag) { drag = null; document.body.classList.remove("resizing"); savePanes(); applyZooms(); }
});
document.addEventListener("dblclick", e => { const h = e.target.closest(".handle"); if (h) togglePane(h.dataset.side); });
S.stack = Math.min(S.stack, D.stacks.length);
render();
</script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
mermaid.initialize({ startOnLoad: false, theme: "dark", flowchart: { useMaxWidth: false }, sequence: { useMaxWidth: false }, themeVariables: { fontFamily: "Inter", fontSize: "12px" } });
window.mermaid = mermaid;
mermaid.run({ querySelector: ".mermaid:not([data-processed])" }).then(() => window.afterMermaid(), () => {});
</script>
</body>
</html>
